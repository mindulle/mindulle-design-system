<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272.13 158.74" width="96mm" height="56mm">
  <defs>
    <style>
      .rich-black-bg { fill: #1c1412; }
      .cut-line { fill: none; stroke: #392d2b; stroke-width: 0.5; stroke-dasharray: 2 2; }
      .brand-title { fill: #f7eeec; font-family: 'Cormorant Garamond', Georgia, serif; }
      .gold-text { fill: #ffd166; font-family: 'Noto Serif KR', Georgia, serif; }
      .engine-badge { fill: #988a88; font-family: 'JetBrains Mono', monospace; }
      .true-stem-dark { stroke: #f7eeec; stroke-width: 2; stroke-linecap: round; }
    </style>
  </defs>

  <!-- 1. Rich Black Bleed Background (C20 M20 Y20 K100 Equiv Tone: #1c1412) -->
  <rect class="rich-black-bg" width="272.13" height="158.74" />

  <!-- 2. Trim Line Indicator (90mm x 50mm) -->
  <rect class="cut-line" x="8.5" y="8.5" width="255.12" height="141.73" />

  <!-- 3. Centered Golden Dandelion Emblem & Architecture -->
  <g transform="translate(118, 42) scale(1.6)">
    <!-- Base Seed Pod (Gold Core) -->
    <path d="M 11.5,17.2 C 9.6,17.5 8.6,19 9.8,21.5 C 10.6,22.2 11.6,22.4 12.4,21.8 C 13.8,19.4 13,17.6 11.5,17.2 Z" fill="#ffd166" stroke="#f59e0b" stroke-width="1.0" />
    <circle cx="11.5" cy="19.4" r="0.65" fill="#ffffff" />
    <!-- True 2px Mast -->
    <path d="M 11.5,17.2 C 12.6,12.8 13.8,8.2 13.5,3.6" class="true-stem-dark" />
    <!-- Main Sail -->
    <path d="M 12.2,14.6 C 8.2,13.2 4.6,11.2 3.6,7.6 C 6.2,7.4 9.2,8 13.2,8.4 Z" stroke="#f7eeec" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" fill="#f7eeec" fill-opacity="0.1" />
    <path d="M 11.4,13.6 C 8.6,12.3 6.6,11 5.2,8.6" stroke="#ffd166" stroke-width="1.4" stroke-linecap="round" />
    <!-- Jib Sail -->
    <path d="M 13,8 C 9.8,6.6 7.8,5.2 7.2,3.2 C 9.2,3.1 11.2,3.6 13.4,4.2 Z" stroke="#f7eeec" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" fill="#f7eeec" fill-opacity="0.1" />
    <!-- Apex Lift Core -->
    <circle cx="13.5" cy="3.6" r="1.4" fill="#ffd166" />
    <circle cx="13.1" cy="3.2" r="0.5" fill="#ffffff" />
  </g>

  <!-- 4. Atelier Slogan & Craft Declaration -->
  <text x="136" y="98" class="gold-text" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.08em">겨울 끝, 민들레.</text>
  <text x="136" y="112" class="brand-title" font-size="8" font-style="italic" text-anchor="middle" letter-spacing="0.1em">AT WINTER'S END, DANDELION</text>

  <!-- 5. Unified Lineage Footnote -->
  <text x="136" y="132" class="engine-badge" font-size="6.5" text-anchor="middle" letter-spacing="0.04em">Crafted by Mindulle Atelier • Powered by Sonagi Engine</text>
</svg>
