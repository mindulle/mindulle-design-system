<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180" fill="none">
  <style>
    :root {
      --bg-color: #FBF9F5;
      --ink-primary: #161616;
      --ink-secondary: #57534E;
      --ink-hairline: #D6D3CD;
      --gold-accent: #D97706;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #12100E;
        --ink-primary: #F7EEEC;
        --ink-secondary: #A8A29E;
        --ink-hairline: #383431;
        --gold-accent: #F59E0B;
      }
    }
    .masthead-bg { fill: var(--bg-color); }
    .ink-text { fill: var(--ink-primary); font-family: "Cormorant Garamond", Georgia, serif; }
    .ink-sub { fill: var(--ink-secondary); font-family: "Pretendard", -apple-system, sans-serif; }
    .ink-meta { fill: var(--ink-secondary); font-family: "JetBrains Mono", monospace; }
    .hairline-thin { stroke: var(--ink-hairline); stroke-width: 1px; }
    .hairline-thick { stroke: var(--ink-primary); stroke-width: 2px; }
    .gold-fill { fill: var(--gold-accent); }
    .gold-stroke { stroke: var(--gold-accent); }
  </style>

  <!-- Newsprint Paper Background -->
  <rect width="800" height="180" class="masthead-bg" />

  <!-- 1. Top Double Hairline Rule -->
  <line x1="32" y1="20" x2="768" y2="20" class="hairline-thick" />
  <line x1="32" y1="24" x2="768" y2="24" class="hairline-thin" />

  <!-- 2. Top Editorial Meta Line -->
  <text x="32" y="38" font-size="10" font-weight="600" letter-spacing="0.15em" class="ink-meta">VOL. 01 • ISSUE 01</text>
  <text x="400" y="38" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.25em" class="ink-text">M I N D U L L E   A T E L I E R</text>
  <text x="768" y="38" text-anchor="end" font-size="10" font-weight="600" letter-spacing="0.15em" class="ink-meta">EST. 2026 • WINTER&apos;S END</text>

  <!-- 3. Sub-divider below meta -->
  <line x1="32" y1="46" x2="768" y2="46" class="hairline-thin" />

  <!-- 4. Centerpiece Symbol Mark (Scaled 32px) -->
  <g transform="translate(180, 62)">
    <!-- 2px Axis Stem -->
    <line x1="16" y1="16" x2="16" y2="44" stroke-width="2" stroke-linecap="round" stroke="var(--ink-primary)" />
    <!-- Sail Curve -->
    <path d="M 6 18 C 6 8, 14 3, 26 10" stroke-width="2" stroke-linecap="round" stroke="var(--ink-primary)" />
    <!-- Seed Rays -->
    <line x1="16" y1="12" x2="16" y2="6" stroke-width="1.75" stroke-linecap="round" class="gold-stroke" />
    <line x1="16" y1="12" x2="22" y2="8" stroke-width="1.75" stroke-linecap="round" class="gold-stroke" />
    <line x1="16" y1="12" x2="10" y2="8" stroke-width="1.75" stroke-linecap="round" class="gold-stroke" />
    <!-- Seed Core -->
    <circle cx="16" cy="12" r="3.5" class="gold-fill" />
  </g>

  <!-- 5. Main Title: MINDULLE GARDEN (The Broadsheet Masthead) -->
  <text x="410" y="96" text-anchor="middle" font-size="38" font-weight="700" letter-spacing="0.28em" class="ink-text">MINDULLE GARDEN</text>

  <!-- 6. Korean Subtitle -->
  <text x="410" y="122" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="0.3em" class="ink-sub">민 들 레 정 원</text>

  <!-- 7. Bottom Philosophy Deck -->
  <text x="400" y="146" text-anchor="middle" font-size="11" font-style="italic" letter-spacing="0.08em" class="ink-text">&ldquo;돌 틈에 단단히 뿌리내리고, 가볍게 사유하는 정원사의 지면&rdquo;</text>

  <!-- 8. Bottom Double Hairline Rule -->
  <line x1="32" y1="160" x2="768" y2="160" class="hairline-thin" />
  <line x1="32" y1="164" x2="768" y2="164" class="hairline-thick" />
</svg>
