<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 64" width="360" height="64" fill="none">
  <!-- Mindulle Atelier Master Horizontal Lockup (1.0D : 0.25D : 2.2D Golden Formula) -->
  <style>
    :root {
      --ink-primary: #161616;
      --ink-secondary: #57534E;
      --divider-color: #D6D3CD;
      --gold-core: #D97706;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink-primary: #F7EEEC;
        --ink-secondary: #A8A29E;
        --divider-color: #383431;
        --gold-core: #F59E0B;
      }
    }
    .text-main { fill: var(--ink-primary); font-family: "Cormorant Garamond", Georgia, serif; font-size: 20px; font-weight: 700; letter-spacing: 0.28em; }
    .text-sub { fill: var(--ink-secondary); font-family: "JetBrains Mono", monospace; font-size: 8.5px; font-weight: 600; letter-spacing: 0.18em; }
    .divider { stroke: var(--divider-color); stroke-width: 1.5px; }
  </style>

  <!-- 1. Left Symbol (48x48 box, offset (8, 8)) -->
  <g transform="translate(8, 8)">
    <!-- 2px Axis Stem -->
    <line x1="24" y1="20" x2="24" y2="44" stroke="var(--ink-primary)" stroke-width="2" stroke-linecap="round" />
    <!-- Sail Arc -->
    <path d="M 10 22 C 10 10, 20 4, 38 12" stroke="var(--ink-primary)" stroke-width="2" stroke-linecap="round" />
    <!-- Seed Rays -->
    <line x1="24" y1="16" x2="24" y2="9" stroke="var(--gold-core)" stroke-width="1.75" stroke-linecap="round" />
    <line x1="24" y1="16" x2="31" y2="12" stroke="var(--gold-core)" stroke-width="1.75" stroke-linecap="round" />
    <line x1="24" y1="16" x2="17" y2="12" stroke="var(--gold-core)" stroke-width="1.75" stroke-linecap="round" />
    <!-- Golden Seed Core -->
    <circle cx="24" cy="16" r="4" fill="var(--gold-core)" />
  </g>

  <!-- 2. Vertical Divider (x=72, y=14 to y=50) -->
  <line x1="72" y1="14" x2="72" y2="50" class="divider" />

  <!-- 3. Typography Stack -->
  <!-- Main Title: MINDULLE -->
  <text x="88" y="32" class="text-main">M I N D U L L E</text>
  <!-- Subtitle: ATELIER • EST. 2026 -->
  <text x="89" y="47" class="text-sub">ATELIER &amp; GARDEN • EST. 2026</text>
</svg>
