<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Pappus Motif (Dandelion Parachute in Winter Wind) -->
  <!-- 1. The Parachute Ribs (Plume Rays) -->
  <path
    d="M 16 14 L 6 6 M 16 14 L 11 4 M 16 14 L 16 3 M 16 14 L 21 4 M 16 14 L 26 6"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
  />

  <!-- 2. The Delicate Connecting Canopy Arc -->
  <path
    d="M 6 6 Q 16 2 26 6"
    stroke="currentColor"
    stroke-width="1.25"
    stroke-linecap="round"
    stroke-dasharray="1.5 2.5"
    opacity="0.6"
  />

  <!-- 3. Stipe (Connecting stalk, 2px stroke) -->
  <line x1="16" y1="14" x2="16" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round" />

  <!-- 4. Achene (Seed payload at bottom) -->
  <path
    d="M 16 22 C 14.5 24, 14.5 27, 16 29 C 17.5 27, 17.5 24, 16 22 Z"
    fill="currentColor"
  />
</svg>
