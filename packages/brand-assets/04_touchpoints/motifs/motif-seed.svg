<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Seed Orbit Motif (Life Vitality in Stone) -->
  <!-- 1. Central Golden Seed Core -->
  <circle cx="16" cy="16" r="3.5" fill="currentColor" />

  <!-- 2. Three Directional Rays (60-deg intervals) -->
  <!-- Top ray (12 o'clock) -->
  <line x1="16" y1="10" x2="16" y2="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
  <!-- Bottom Right ray (4 o'clock) -->
  <line x1="21.2" y1="19" x2="26.4" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
  <!-- Bottom Left ray (8 o'clock) -->
  <line x1="10.8" y1="19" x2="5.6" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round" />

  <!-- 3. Outer Orbit Hairline (Light compass arc) -->
  <path
    d="M 23 9 A 12 12 0 0 1 27 19"
    stroke="currentColor"
    stroke-width="1.25"
    stroke-linecap="round"
    stroke-dasharray="2 3"
    opacity="0.5"
  />
  <path
    d="M 9 23 A 12 12 0 0 1 5 13"
    stroke="currentColor"
    stroke-width="1.25"
    stroke-linecap="round"
    stroke-dasharray="2 3"
    opacity="0.5"
  />
</svg>
